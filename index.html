<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Swapper</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

.app{
    max-width:650px;
    margin:auto;
    background:#1c1c1c;
    padding:22px;
    border-radius:18px;
}

h1{
    text-align:center;
    margin:0 0 5px;
}

.sub{
    text-align:center;
    color:#888;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #444;
    background:#292929;
    color:white;
}

button{
    width:100%;
    margin-top:12px;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#287cff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    background:#444;
    color:#888;
}

#download{
    background:#20b96b;
    display:none;
}

.progress{
    margin-top:20px;
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#287cff;
}

.status{
    text-align:center;
    color:#aaa;
    margin-top:12px;
    min-height:22px;
}

video{
    display:none;
}
</style>
</head>

<body>

<div class="app">

<h1>Frame Swapper</h1>

<div class="sub">
ABCD → ACBD
</div>

<input
    id="file"
    type="file"
    accept="video/*"
>

<button id="start">
Начать обработку
</button>

<div class="progress">
    <div id="bar" class="bar"></div>
</div>

<div id="status" class="status">
Выберите видео
</div>

<button id="download">
Скачать WebM
</button>

</div>

<script>

const fileInput =
    document.getElementById("file");

const startButton =
    document.getElementById("start");

const downloadButton =
    document.getElementById("download");

const statusText =
    document.getElementById("status");

const progressBar =
    document.getElementById("bar");


let resultURL = null;


/* ================================
   FILE
================================ */

fileInput.addEventListener(
    "change",
    () => {

        if(fileInput.files.length){

            statusText.textContent =
                "Выбрано: " +
                fileInput.files[0].name;

        }

    }
);


/* ================================
   START
================================ */

startButton.addEventListener(
    "click",
    start
);


async function start(){

    const file =
        fileInput.files[0];

    if(!file){

        statusText.textContent =
            "Выберите видео";

        return;

    }


    startButton.disabled = true;
    fileInput.disabled = true;
    downloadButton.style.display = "none";

    progressBar.style.width = "0%";


    try{

        await process(file);

    }catch(error){

        console.error(error);

        statusText.textContent =
            "Ошибка: " + error.message;

        startButton.disabled = false;
        fileInput.disabled = false;

    }

}


/* ================================
   PROCESS
================================ */

async function process(file){

    statusText.textContent =
        "Загрузка видео...";


    const url =
        URL.createObjectURL(file);


    const video =
        document.createElement("video");


    video.src = url;

    video.playsInline = true;

    video.preload = "auto";

    video.volume = 0;


    await waitMetadata(video);


    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    const duration =
        video.duration;


    if(!width || !height){

        throw new Error(
            "Не удалось определить размер видео"
        );

    }


    if(!Number.isFinite(duration)){

        throw new Error(
            "Не удалось определить длительность"
        );

    }


    /*
       Запускаем видео.
    */

    await video.play();


    /*
       Получаем поток исходного видео.

       Здесь находится оригинальный звук.
    */

    const sourceStream =
        video.captureStream();


    const audioTracks =
        sourceStream.getAudioTracks();


    /*
       FPS исходного видео.

       Если браузер не сообщает —
       используем 30.
    */

    let fps = 30;


    const settings =
        sourceStream
        .getVideoTracks()[0]
        ?.getSettings();


    if(
        settings &&
        settings.frameRate
    ){

        fps =
            Math.round(
                settings.frameRate
            );

    }


    fps =
        Math.max(
            1,
            Math.min(
                60,
                fps
            )
        );


    /*
       Canvas.
    */

    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    /*
       Canvas записывается в WebM.
    */

    const outputStream =
        canvas.captureStream(fps);


    /*
       Добавляем оригинальный звук.
    */

    for(
        const track of audioTracks
    ){

        outputStream.addTrack(track);

    }


    /*
       Выбираем WebM кодек.
    */

    let mime =
        "video/webm";


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp9,opus";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp8,opus";

    }


    const recorder =
        new MediaRecorder(
            outputStream,
            {
                mimeType:mime,
                videoBitsPerSecond:8000000,
                audioBitsPerSecond:128000
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size
            ){

                chunks.push(
                    event.data
                );

            }

        };


    const stopped =
        new Promise(
            resolve => {

                recorder.onstop =
                    resolve;

            }
        );


    recorder.start(1000);


    /*
       Четыре кадра.

       A B C D
    */

    let frames = [];


    let finished = false;

    let frameCount = 0;


    /*
       Обрабатываем кадр,
       когда браузер реально его показал.
    */

    const processFrame =
        async function(
            now,
            metadata
        ){

            if(finished){

                return;

            }


            /*
               Создаём копию текущего кадра.

               Это важно:
               видео продолжает идти,
               а кадр остаётся в памяти.
            */

            const bitmap =
                await createImageBitmap(video);


            frames.push(bitmap);


            frameCount++;


            /*
               Прогресс.
            */

            const currentTime =
                video.currentTime;


            let percent =
                Math.floor(
                    currentTime /
                    duration *
                    100
                );


            percent =
                Math.min(
                    99,
                    percent
                );


            progressBar.style.width =
                percent + "%";


            statusText.textContent =
                "Обработка: " +
                percent +
                "%";


            /*
               Получили 4 кадра.
            */

            if(frames.length === 4){

                const group =
                    frames;

                frames = [];


                /*
                   ABCD → ACBD
                */

                await outputFrame(
                    group[0]
                );

                await outputFrame(
                    group[2]
                );

                await outputFrame(
                    group[1]
                );

                await outputFrame(
                    group[3]
                );


                /*
                   Освобождаем память.
                */

                for(
                    const bitmap of group
                ){

                    bitmap.close();

                }

            }


            /*
               Видео закончилось.
            */

            if(
                video.ended ||
                currentTime >= duration - 0.02
            ){

                await finish();

                return;

            }


            /*
               Следующий настоящий кадр.
            */

            video.requestVideoFrameCallback(
                processFrame
            );

        };


    /*
       Первый кадр.
    */

    video.requestVideoFrameCallback(
        processFrame
    );


    /*
       Завершение видео.

       Это дополнительная страховка.
    */

    video.addEventListener(
        "ended",
        async () => {

            if(!finished){

                await finish();

            }

        },
        {
            once:true
        }
    );


    /*
       Вывод кадра на canvas.
    */

    async function outputFrame(
        bitmap
    ){

        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        ctx.drawImage(
            bitmap,
            0,
            0,
            width,
            height
        );


        /*
           Даём MediaRecorder
           зафиксировать кадр.
        */

        await sleep(
            1000 / fps
        );

    }


    /*
       FINISH
    */

    async function finish(){

        if(finished){

            return;

        }


        finished = true;


        /*
           Если остались кадры
           в последней неполной группе,
           сохраняем их как есть.
        */

        if(frames.length){

            for(
                const bitmap of frames
            ){

                await outputFrame(
                    bitmap
                );

                bitmap.close();

            }

            frames = [];

        }


        statusText.textContent =
            "Формирование WebM...";


        progressBar.style.width =
            "99%";


        /*
           Даём MediaRecorder
           записать последние данные.
        */

        await sleep(700);


        if(
            recorder.state !== "inactive"
        ){

            recorder.stop();

        }


        /*
           ВАЖНО:
           здесь мы действительно ждём
           onstop, а не reader.done.
        */

        await stopped;


        const blob =
            new Blob(
                chunks,
                {
                    type:mime
                }
            );


        if(!blob.size){

            throw new Error(
                "Итоговый файл пустой"
            );

        }


        if(resultURL){

            URL.revokeObjectURL(
                resultURL
            );

        }


        resultURL =
            URL.createObjectURL(
                blob
            );


        progressBar.style.width =
            "100%";


        statusText.textContent =
            "Готово!";


        downloadButton.style.display =
            "block";


        startButton.disabled =
            false;

        fileInput.disabled =
            false;


        URL.revokeObjectURL(
            url
        );

    }

}


/* ================================
   HELPERS
================================ */

function waitMetadata(video){

    return new Promise(
        (resolve,reject) => {

            if(
                video.readyState >= 1
            ){

                resolve();

                return;

            }


            video.addEventListener(
                "loadedmetadata",
                resolve,
                {
                    once:true
                }
            );


            video.addEventListener(
                "error",
                () => {

                    reject(
                        new Error(
                            "Ошибка загрузки видео"
                        )
                    );

                },
                {
                    once:true
                }
            );

        }
    );

}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* ================================
   DOWNLOAD
================================ */

downloadButton.addEventListener(
    "click",
    () => {

        if(!resultURL){

            return;

        }


        const link =
            document.createElement("a");


        link.href =
            resultURL;


        link.download =
            "Frame_Swapped.webm";


        document.body.appendChild(link);


        link.click();


        link.remove();

    }
);

</script>

</body>
</html>
