<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Swapper</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.app{
    max-width:650px;
    margin:auto;
    background:#1c1c1c;
    padding:22px;
    border-radius:18px;
}

h1{
    text-align:center;
    margin:0 0 8px;
}

.sub{
    text-align:center;
    color:#999;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:16px;
    background:#292929;
    color:white;
    border:1px solid #444;
    border-radius:10px;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#287cff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    background:#444;
    color:#888;
}

.download{
    background:#20b96b;
}

.progress{
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    width:0%;
    height:100%;
    background:#287cff;
}

.status{
    text-align:center;
    color:#aaa;
    margin-top:12px;
    min-height:22px;
}

.info{
    margin-top:20px;
    padding:15px;
    background:#252525;
    border-radius:10px;
    color:#aaa;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<h1>Frame Swapper</h1>

<div class="sub">
ABCD → ACBD
</div>

<input
    id="file"
    type="file"
    accept="video/*"
>

<button
    id="start"
    onclick="startProcessing()"
>
Начать обработку
</button>

<div class="progress">
    <div id="bar" class="bar"></div>
</div>

<div id="status" class="status">
Выберите видео
</div>

<button
    id="download"
    class="download"
    style="display:none"
    onclick="downloadResult()"
>
Скачать WebM
</button>

<div class="info">
    <b>Перестановка:</b><br>
    A B C D → A C B D<br><br>

    Видео переставляется физически.<br>
    Оригинальный звук сохраняется.
</div>

</div>

<script>

let selectedFile = null;
let resultURL = null;


/* =========================================
   FILE
========================================= */

document.getElementById("file").onchange = function(){

    selectedFile = this.files[0];

    if(selectedFile){

        document.getElementById("status").textContent =
            "Выбрано: " + selectedFile.name;

    }

};


/* =========================================
   START
========================================= */

async function startProcessing(){

    if(!selectedFile){

        document.getElementById("status").textContent =
            "Сначала выберите видео";

        return;

    }


    if(
        typeof MediaStreamTrackProcessor ===
        "undefined"
    ){

        document.getElementById("status").textContent =
            "Откройте страницу в Chrome";

        return;

    }


    document.getElementById("start").disabled =
        true;

    document.getElementById("file").disabled =
        true;

    document.getElementById("download").style.display =
        "none";


    try{

        await processVideo();

    }catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "Ошибка: " + error.message;

        document.getElementById("start").disabled =
            false;

        document.getElementById("file").disabled =
            false;

    }

}


/* =========================================
   PROCESS VIDEO
========================================= */

async function processVideo(){

    setProgress(
        1,
        "Открываю видео..."
    );


    const video =
        document.createElement("video");

    video.muted = true;

    video.playsInline = true;

    video.preload = "auto";


    const inputURL =
        URL.createObjectURL(
            selectedFile
        );


    video.src =
        inputURL;


    await waitMetadata(video);


    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    const duration =
        video.duration;


    if(!width || !height){

        throw new Error(
            "Не удалось определить видео"
        );

    }


    setProgress(
        3,
        "Подготовка..."
    );


    /*
       Запускаем видео.
    */

    await video.play();


    /*
       Получаем исходный поток.
       В нём есть видео + аудио.
    */

    const inputStream =
        video.captureStream();


    const videoTrack =
        inputStream.getVideoTracks()[0];


    const audioTracks =
        inputStream.getAudioTracks();


    if(!videoTrack){

        throw new Error(
            "Не найден видеотрек"
        );

    }


    /*
       Читаем видеокадры последовательно.
    */

    const processor =
        new MediaStreamTrackProcessor({
            track:videoTrack
        });


    const reader =
        processor.readable.getReader();


    /*
       Canvas для переставленного видео.
    */

    const canvas =
        document.createElement("canvas");

    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    /*
       Выходной видеопоток.
    */

    const outputStream =
        canvas.captureStream(30);


    /*
       ДОБАВЛЯЕМ ОРИГИНАЛЬНЫЙ ЗВУК.
    */

    for(
        const track of audioTracks
    ){

        outputStream.addTrack(
            track
        );

    }


    /*
       WebM с VP9 + Opus.
    */

    let mime =
        "video/webm";


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp9,opus";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp8,opus";

    }


    const recorder =
        new MediaRecorder(
            outputStream,
            {
                mimeType:mime,
                videoBitsPerSecond:8000000,
                audioBitsPerSecond:128000
            }
        );


    const chunks = [];


    recorder.ondataavailable =
    function(event){

        if(
            event.data &&
            event.data.size > 0
        ){

            chunks.push(
                event.data
            );

        }

    };


    const recorderFinished =
        new Promise(
            resolve => {

                recorder.onstop =
                    resolve;

            }
        );


    recorder.start(1000);


    /*
       ВАЖНО:

       В памяти одновременно
       максимум 4 кадра.
    */

    let group = [];

    let frameNumber = 0;

    let lastProgress = 0;


    while(true){

        const result =
            await reader.read();


        if(result.done){

            break;

        }


        const frame =
            result.value;


        group.push(frame);


        /*
           Получили 4 кадра.
        */

        if(group.length === 4){

            /*
               A
            */

            await outputFrame(
                group[0],
                ctx,
                canvas
            );


            /*
               C
            */

            await outputFrame(
                group[2],
                ctx,
                canvas
            );


            /*
               B
            */

            await outputFrame(
                group[1],
                ctx,
                canvas
            );


            /*
               D
            */

            await outputFrame(
                group[3],
                ctx,
                canvas
            );


            /*
               Освобождаем память.
            */

            for(
                const f of group
            ){

                try{
                    f.close();
                }catch(e){}

            }


            group = [];


            frameNumber += 4;


            const currentTime =
                frame.timestamp /
                1000000;


            let progress =
                Math.round(
                    currentTime /
                    duration *
                    100
                );


            progress =
                Math.min(
                    99,
                    progress
                );


            /*
               Обновляем UI не на каждый кадр.
            */

            if(
                progress !== lastProgress
            ){

                lastProgress =
                    progress;


                setProgress(
                    progress,
                    "Обработка: " +
                    progress +
                    "%"
                );

            }

        }

    }


    /*
       Если осталось 1-3 кадра,
       тоже обрабатываем.
    */

    if(group.length){

        for(
            const frame of group
        ){

            await outputFrame(
                frame,
                ctx,
                canvas
            );


            try{
                frame.close();
            }catch(e){}

        }

    }


    reader.releaseLock();


    /*
       Даём последним кадрам
       записаться.
    */

    await sleep(700);


    recorder.stop();


    await recorderFinished;


    /*
       Создаём итоговый WebM.
    */

    const blob =
        new Blob(
            chunks,
            {
                type:mime
            }
        );


    if(resultURL){

        URL.revokeObjectURL(
            resultURL
        );

    }


    resultURL =
        URL.createObjectURL(
            blob
        );


    URL.revokeObjectURL(
        inputURL
    );


    setProgress(
        100,
        "Готово!"
    );


    document.getElementById(
        "download"
    ).style.display =
        "block";


    document.getElementById(
        "start"
    ).disabled =
        false;


    document.getElementById(
        "file"
    ).disabled =
        false;

}


/* =========================================
   DRAW FRAME
========================================= */

function outputFrame(
    frame,
    ctx,
    canvas
){

    return new Promise(
        resolve => {

            ctx.drawImage(
                frame,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
               Canvas должен успеть
               передать кадр recorder.
            */

            requestAnimationFrame(
                () => resolve()
            );

        }
    );

}


/* =========================================
   METADATA
========================================= */

function waitMetadata(video){

    return new Promise(
        (resolve,reject)=>{

            if(
                video.readyState >= 1
            ){

                resolve();
                return;

            }


            video.onloadedmetadata =
                resolve;


            video.onerror =
                ()=>{
                    reject(
                        new Error(
                            "Не удалось открыть видео"
                        )
                    );
                };

        }
    );

}


/* =========================================
   PROGRESS
========================================= */

function setProgress(
    value,
    text
){

    document.getElementById(
        "bar"
    ).style.width =
        value + "%";


    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =========================================
   SLEEP
========================================= */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================
   DOWNLOAD
========================================= */

function downloadResult(){

    if(!resultURL)
        return;


    const a =
        document.createElement("a");


    a.href =
        resultURL;


    a.download =
        "frame_swapped.webm";


    document.body.appendChild(a);


    a.click();


    a.remove();

}

</script>

</body>
 </html>
