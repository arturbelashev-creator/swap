<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frame Swapper FAST</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.app{
    width:100%;
    max-width:650px;
    margin:auto;
    background:#1c1c1c;
    padding:22px;
    border-radius:18px;
}

h1{
    text-align:center;
    margin:0 0 8px;
}

.sub{
    text-align:center;
    color:#999;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:16px;
    background:#292929;
    border:1px solid #444;
    border-radius:10px;
    color:#fff;
}

button{
    width:100%;
    padding:16px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#287cff;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#444;
    color:#888;
}

.download{
    background:#20b96b;
}

.progress{
    width:100%;
    height:12px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    width:0%;
    height:100%;
    background:#287cff;
    transition:width .1s linear;
}

.status{
    text-align:center;
    color:#aaa;
    margin-top:12px;
    min-height:22px;
}

.info{
    margin-top:20px;
    padding:15px;
    background:#252525;
    border-radius:10px;
    color:#aaa;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<h1>Frame Swapper</h1>

<div class="sub">
ABCD → ACBD
</div>

<input
    id="file"
    type="file"
    accept="video/*"
>

<button
    id="start"
    onclick="startProcessing()"
>
Начать обработку
</button>

<div class="progress">
    <div id="bar" class="bar"></div>
</div>

<div id="status" class="status">
Выберите видео
</div>

<button
    id="download"
    class="download"
    onclick="downloadResult()"
    style="display:none"
>
Скачать готовое WebM
</button>

<div class="info">
<b>Перестановка кадров</b><br><br>

A B C D → A C B D<br><br>

Оригинальный звук сохраняется.
</div>

</div>


<script>

let selectedFile = null;
let resultURL = null;


/* =====================================
   ВЫБОР ФАЙЛА
===================================== */

document.getElementById("file").onchange = function(){

    selectedFile = this.files[0];

    if(selectedFile){

        document.getElementById("status").textContent =
            "Выбрано: " + selectedFile.name;

    }

};


/* =====================================
   START
===================================== */

async function startProcessing(){

    if(!selectedFile){

        document.getElementById("status").textContent =
            "Сначала выберите видео";

        return;
    }


    document.getElementById("start").disabled = true;
    document.getElementById("file").disabled = true;
    document.getElementById("download").style.display = "none";


    try{

        await processVideo();

    }catch(error){

        console.error(error);

        document.getElementById("status").textContent =
            "Ошибка: " + error.message;

        document.getElementById("start").disabled = false;
        document.getElementById("file").disabled = false;

    }

}


/* =====================================
   MAIN
===================================== */

async function processVideo(){

    setProgress(
        1,
        "Открываю видео..."
    );


    const video =
        document.createElement("video");


    video.muted = true;
    video.playsInline = true;
    video.preload = "auto";


    const inputURL =
        URL.createObjectURL(selectedFile);


    video.src =
        inputURL;


    await waitMetadata(video);


    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    const duration =
        video.duration;


    if(
        !width ||
        !height ||
        !duration
    ){

        throw new Error(
            "Не удалось определить параметры видео"
        );

    }


    setProgress(
        3,
        width +
        "×" +
        height +
        " • запуск..."
    );


    /*
       ВАЖНО:

       captureStream идёт в реальном времени.
       Поэтому мы больше НЕ ждём reader.done.
    */

    await video.play();


    const sourceStream =
        video.captureStream();


    const sourceVideoTrack =
        sourceStream.getVideoTracks()[0];


    if(!sourceVideoTrack){

        throw new Error(
            "Не удалось получить видеопоток"
        );

    }


    /*
       Получаем аудио.
    */

    const audioTracks =
        sourceStream.getAudioTracks();


    /*
       Processor.
    */

    const processor =
        new MediaStreamTrackProcessor({
            track:sourceVideoTrack
        });


    const reader =
        processor.readable.getReader();


    /*
       Canvas.
    */

    const canvas =
        document.createElement("canvas");


    canvas.width =
        width;

    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    /*
       Очень важно:

       0 FPS = ручная выдача кадров.
    */

    const outputStream =
        canvas.captureStream(0);


    /*
       Добавляем оригинальный звук.
    */

    for(
        const audioTrack of audioTracks
    ){

        outputStream.addTrack(
            audioTrack
        );

    }


    /*
       WebM.
    */

    let mime =
        "video/webm";


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp9,opus";

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        mime =
            "video/webm;codecs=vp8,opus";

    }


    const recorder =
        new MediaRecorder(
            outputStream,
            {
                mimeType:mime,
                videoBitsPerSecond:8000000,
                audioBitsPerSecond:128000
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        function(e){

            if(
                e.data &&
                e.data.size > 0
            ){

                chunks.push(e.data);

            }

        };


    let recorderStopped = false;


    const recorderDone =
        new Promise(
            resolve => {

                recorder.onstop =
                    function(){

                        recorderStopped = true;

                        resolve();

                    };

            }
        );


    /*
       НАЧИНАЕМ ЗАПИСЬ
    */

    recorder.start(1000);


    /*
       Читаем видео.

       Храним только 4 кадра.
    */

    let group = [];

    let framesProcessed = 0;

    let lastPercent = -1;


    /*
       Читаем кадры пока видео
       реально идёт.

       НЕ ждём reader.done.
    */

    const readLoop = async function(){

        while(true){

            const result =
                await reader.read();


            if(result.done){

                break;

            }


            const frame =
                result.value;


            group.push(frame);


            /*
               Получили:

               A B C D
            */

            if(group.length === 4){

                /*
                   A
                */

                drawAndSend(
                    group[0],
                    ctx,
                    canvas,
                    outputStream
                );


                /*
                   C
                */

                drawAndSend(
                    group[2],
                    ctx,
                    canvas,
                    outputStream
                );


                /*
                   B
                */

                drawAndSend(
                    group[1],
                    ctx,
                    canvas,
                    outputStream
                );


                /*
                   D
                */

                drawAndSend(
                    group[3],
                    ctx,
                    canvas,
                    outputStream
                );


                /*
                   Закрываем кадры.
                */

                for(
                    const frameToClose of group
                ){

                    try{
                        frameToClose.close();
                    }catch(e){}

                }


                group = [];


                framesProcessed += 4;


                /*
                   Прогресс.

                   Видео идёт в реальном времени,
                   поэтому timestamp кадра
                   показывает реальный прогресс.
                */

                const currentTime =
                    frame.timestamp / 1000000;


                let percent =
                    Math.floor(
                        currentTime /
                        duration *
                        100
                    );


                percent =
                    Math.min(
                        98,
                        percent
                    );


                if(
                    percent !== lastPercent
                ){

                    lastPercent =
                        percent;


                    setProgress(
                        percent,
                        "Обработка: " +
                        percent +
                        "%"
                    );

                }

            }

        }

    };


    /*
       Запускаем чтение,
       но НЕ ждём его окончания.
    */

    readLoop().catch(
        console.error
    );


    /*
       Ждём реальную длительность видео.

       Это главное исправление.

       Больше нет зависания на 99%.
    */

    await sleep(
        duration * 1000 + 1000
    );


    /*
       Останавливаем чтение.
    */

    try{

        await reader.cancel();

    }catch(e){}


    /*
       Обрабатываем остаток:

       например A B C
    */

    if(group.length){

        const copy =
            [...group];


        /*
           Для неполной группы
           просто сохраняем порядок.
        */

        for(
            const frame of copy
        ){

            drawAndSend(
                frame,
                ctx,
                canvas,
                outputStream
            );


            try{
                frame.close();
            }catch(e){}

        }


        group = [];

    }


    /*
       Даём последним данным
       попасть в MediaRecorder.
    */

    await sleep(500);


    /*
       Останавливаем запись.
    */

    if(!recorderStopped){

        recorder.stop();

    }


    /*
       Ждём окончание записи.
    */

    await recorderDone;


    /*
       Результат.
    */

    const blob =
        new Blob(
            chunks,
            {
                type:mime
            }
        );


    if(!blob.size){

        throw new Error(
            "Получился пустой файл"
        );

    }


    if(resultURL){

        URL.revokeObjectURL(
            resultURL
        );

    }


    resultURL =
        URL.createObjectURL(blob);


    /*
       Готово.
    */

    setProgress(
        100,
        "Готово!"
    );


    document.getElementById(
        "download"
    ).style.display =
        "block";


    document.getElementById(
        "start"
    ).disabled =
        false;


    document.getElementById(
        "file"
    ).disabled =
        false;


    URL.revokeObjectURL(
        inputURL
    );

}


/* =====================================
   DRAW + SEND FRAME
===================================== */

function drawAndSend(
    frame,
    ctx,
    canvas,
    stream
){

    ctx.drawImage(
        frame,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Ручная выдача кадра.
    */

    if(
        typeof stream.requestFrame ===
        "function"
    ){

        stream.requestFrame();

    }

}


/* =====================================
   METADATA
===================================== */

function waitMetadata(video){

    return new Promise(
        (resolve,reject)=>{

            if(
                video.readyState >= 1 &&
                video.videoWidth > 0
            ){

                resolve();

                return;

            }


            video.onloadedmetadata =
                function(){

                    resolve();

                };


            video.onerror =
                function(){

                    reject(
                        new Error(
                            "Видео не открылось"
                        )
                    );

                };

        }
    );

}


/* =====================================
   PROGRESS
===================================== */

function setProgress(
    value,
    text
){

    document.getElementById(
        "bar"
    ).style.width =
        value + "%";


    document.getElementById(
        "status"
    ).textContent =
        text;

}


/* =====================================
   SLEEP
===================================== */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================
   DOWNLOAD
===================================== */

function downloadResult(){

    if(!resultURL){

        return;

    }


    const a =
        document.createElement("a");


    a.href =
        resultURL;


    a.download =
        "frame_swapped.webm";


    document.body.appendChild(a);


    a.click();


    a.remove();

}

</script>

</body>
</html>
